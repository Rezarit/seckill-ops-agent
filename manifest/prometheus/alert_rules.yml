# Prometheus 告警规则文件
# 用于模拟运维场景的测试告警

groups:
  - name: system_alerts
    rules:
      # 告警 1: CPU 高负载
      - alert: HighCPUUsage
        expr: vector(95)  # 模拟 CPU 使用率 95%
        for: 30s
        labels:
          severity: critical
          service: web-api
          instance: server-01
          team: ops
        annotations:
          summary: "CPU 使用率过高"
          description: "服务器 server-01 的 CPU 使用率达到 95%，超过阈值 90%，可能导致服务响应缓慢"
          value: "95%"

      # 告警 2: 内存不足
      - alert: MemoryLow
        expr: vector(8)  # 模拟可用内存 8%
        for: 30s
        labels:
          severity: warning
          service: database
          instance: server-02
          team: ops
        annotations:
          summary: "可用内存不足"
          description: "服务器 server-02 的可用内存仅剩 8%，低于阈值 10%，建议尽快清理或扩容"
          value: "8%"

      # 告警 3: 服务宕机
      - alert: ServiceDown
        expr: vector(0)  # 模拟服务状态为 0（不可用）
        for: 30s
        labels:
          severity: critical
          service: payment-service
          instance: server-03
          team: dev
        annotations:
          summary: "支付服务不可用"
          description: "支付服务 payment-service 在 server-03 上已宕机超过 30 秒，可能影响用户支付功能"
          value: "down"