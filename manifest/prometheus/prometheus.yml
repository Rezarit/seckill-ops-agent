# Prometheus 配置文件
# 包含告警规则文件引用

global:
  scrape_interval: 15s      # 默认抓取间隔
  evaluation_interval: 15s  # 告警规则评估间隔

# 告警规则文件
rule_files:
  - "/etc/prometheus/alert_rules.yml"

# 抓取配置（仅抓取 Prometheus 自身）
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']